<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login – Animatickets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:        #f95607;
      --brand-dark:   #d84a05;
      --brand-light:  #fff3ee;
      --brand-glow:   rgba(249,86,7,.18);
      --text:         #1a202c;
      --text-muted:   #718096;
      --border:       #e2e8f0;
      --bg:           #f4f6f9;
      --card:         #ffffff;
      --radius:       14px;
      --shadow:       0 6px 28px rgba(0,0,0,.08);
      --shadow-sm:    0 2px 10px rgba(0,0,0,.06);
      --error:        #e53e3e;
      --success:      #38a169;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    /* ─── HEADER ─────────────────────────────────────────────── */
    .header {
      background: var(--brand);
      box-shadow: 0 3px 16px rgba(249,86,7,.35);
      position: sticky; top: 0; z-index: 200;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      min-height: 72px;
    }
    .header-logo {
      max-height: 44px; max-width: 200px;
      object-fit: contain;
    }
    .header-user {
      display: none;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: rgba(255,255,255,.85);
    }
    .header-user.show { display: flex; }
    .header-email { font-weight: 500; }
    .btn-logout {
      height: 34px; padding: 0 14px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.28); }

    /* ─── LOGIN PAGE ──────────────────────────────────────────── */
    #auth-section {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 72px);
    }
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .login-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 40px 36px 44px;
      width: 100%;
      max-width: 420px;
    }
    .card-title { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 4px; }
    .card-sub   { font-size: 13.5px; color: var(--text-muted); margin-bottom: 32px; }

    .fg { display: flex; flex-direction: column; gap: 5px; margin-bottom: 18px; }
    label { font-size: 12.5px; font-weight: 500; color: var(--text); }

    .input-wrap { position: relative; display: flex; align-items: center; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%; height: 48px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 0 13px;
      font-family: inherit; font-size: 15px;
      color: var(--text); background: #fff;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
      -webkit-appearance: none; appearance: none;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-glow); }
    input.err   { border-color: var(--error); box-shadow: 0 0 0 3px rgba(229,62,62,.12); animation: shake .35s ease; }

    .toggle-pw {
      position: absolute; right: 12px;
      background: none; border: none; cursor: pointer;
      padding: 4px; color: var(--text-muted);
      display: flex; align-items: center;
      transition: color .18s;
      -webkit-tap-highlight-color: transparent;
    }
    .toggle-pw:hover { color: var(--brand); }
    input.pw-field { padding-right: 44px; }

    .err-msg { font-size: 11.5px; color: var(--error); margin-top: 2px; display: none; }
    .err-msg.show { display: block; }

    .btn-login {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; height: 52px; margin-top: 28px;
      background: var(--brand); color: #fff;
      border: none; border-radius: 10px;
      font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--brand-glow);
      transition: background .2s, transform .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .btn-login:hover   { background: var(--brand-dark); transform: translateY(-1px); box-shadow: 0 7px 22px var(--brand-glow); }
    .btn-login:active  { transform: translateY(0); }
    .btn-login:disabled{ opacity: .65; cursor: not-allowed; transform: none; }

    .spin-btn {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spinRound .65s linear infinite;
      display: none;
    }
    .btn-login.loading .spin-btn  { display: block; }
    .btn-login.loading .btn-text  { display: none; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 28px 0 0;
      color: var(--text-muted); font-size: 12px;
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }

    .footer {
      text-align: center; padding: 20px 16px 28px;
      font-size: 12px; color: var(--text-muted);
    }

    /* ─── DASHBOARD ───────────────────────────────────────────── */
    #dash-section { display: none; }
    .dash-wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 60px; }

    .dash-topbar {
      display: flex; align-items: flex-start;
      justify-content: space-between; flex-wrap: wrap;
      gap: 12px; margin-bottom: 24px;
    }
    .dash-title { font-size: 21px; font-weight: 700; letter-spacing: -.2px; }
    .dash-sub   { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    .count-bar {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-muted);
      margin-bottom: 16px;
    }
    .count-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 26px; height: 22px; padding: 0 8px;
      background: var(--brand); color: #fff;
      border-radius: 99px; font-size: 12px; font-weight: 700;
    }

    /* ─── SUBMISSION CARD ────────────────────────────────────── */
    .sub-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .sub-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
      transition: background .15s;
      gap: 12px;
    }
    .sub-header:hover { background: #fafafa; }
    .sub-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .sub-arrow {
      flex-shrink: 0;
      color: var(--brand);
      transition: transform .22s;
    }
    .sub-arrow.open { transform: rotate(90deg); }
    .sub-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub-meta  { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .badge-status {
      flex-shrink: 0;
      font-size: 11px; font-weight: 700;
      padding: 4px 11px; border-radius: 99px;
      background: var(--brand-light); color: var(--brand);
      text-transform: capitalize;
    }

    .sub-body {
      display: none;
      padding: 4px 20px 24px;
      border-top: 1px solid var(--border);
      animation: fadeIn .2s ease;
    }
    .sub-body.open { display: block; }

    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

    /* ─── DATA SECTIONS ──────────────────────────────────────── */
    .data-section { margin-top: 20px; }
    .data-section-title {
      font-size: 11px; font-weight: 700;
      color: var(--brand);
      letter-spacing: .6px;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid var(--brand-light);
    }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px 20px;
    }
    .field-row { display: flex; flex-direction: column; gap: 2px; }
    .field-key { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .field-val { font-size: 13.5px; color: var(--text); font-weight: 500; word-break: break-word; }

    /* ─── DOCUMENT BUTTONS ───────────────────────────────────── */
    .doc-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .btn-doc {
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 14px;
      background: var(--brand-light); color: var(--brand);
      border: 1px solid #f9c49c; border-radius: 8px;
      font-size: 12.5px; font-weight: 600;
      text-decoration: none;
      transition: background .15s;
    }
    .btn-doc:hover { background: #ffe5d4; }

    /* ─── EMPTY / LOADING ────────────────────────────────────── */
    .empty-state, .loading-state {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted); font-size: 14px;
    }
    .load-spin {
      width: 32px; height: 32px; margin: 0 auto 16px;
      border: 3px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spinRound .65s linear infinite;
    }

    /* ─── TOAST ──────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1a202c; color: #fff;
      padding: 13px 26px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      opacity: 0; transition: opacity .22s, transform .22s;
      z-index: 500; pointer-events: none;
      white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
    .toast.show { opacity:1; transform: translateX(-50%) translateY(0); }

    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
    @keyframes spinRound { to { transform: rotate(360deg); } }

    @media (max-width: 520px) {
      .login-card  { padding: 28px 20px 32px; }
      .sub-header  { padding: 14px 16px; }
      .sub-body    { padding: 4px 16px 20px; }
      .field-grid  { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ───────────────────────────────────────────────── -->
<header class="header">
  <div class="header-inner">
    <img src="../logo-anima.png" alt="Animatickets" class="header-logo">
    <div class="header-user" id="header-user">
      <span class="header-email" id="header-email"></span>
      <button class="btn-logout" onclick="handleLogout()">Sair</button>
    </div>
  </div>
</header>

<!-- ── AUTH SECTION ─────────────────────────────────────────── -->
<div id="auth-section">
  <main class="main">
    <div class="login-card">
      <h1 class="card-title">Acesso Administrativo</h1>
      <p class="card-sub">Entre com suas credenciais para continuar</p>

      <form id="login-form" onsubmit="handleLogin(event)" novalidate>
        <div class="fg">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
          <span class="err-msg" id="email-err">Informe um e-mail válido.</span>
        </div>

        <div class="fg">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <input type="password" id="password" class="pw-field" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Mostrar / ocultar senha">
              <svg id="icon-show" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="icon-hide" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="err-msg" id="pw-err">Informe a senha.</span>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">Entrar</span>
          <div class="spin-btn"></div>
        </button>
      </form>

      <div class="divider">acesso restrito</div>
    </div>
  </main>
  <footer class="footer">
    &copy; <span id="yr"></span> Animatickets. Todos os direitos reservados.
  </footer>
</div>

<!-- ── DASHBOARD SECTION ─────────────────────────────────────── -->
<div id="dash-section">
  <div class="dash-wrap">
    <div class="dash-topbar">
      <div>
        <h2 class="dash-title">Formulários Enviados</h2>
        <p class="dash-sub">Cadastros recebidos pelo formulário do produtor</p>
      </div>
    </div>

    <div class="count-bar">
      <span class="count-badge" id="form-count">0</span>
      <span id="count-label">formulários</span>
    </div>

    <div id="forms-loading" class="loading-state">
      <div class="load-spin"></div>
      Carregando formulários...
    </div>
    <div id="forms-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  /* ── Firebase Init ─────────────────────────────────────────── */
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  let unsubscribeSnapshot = null;

  /* ── Auth State ────────────────────────────────────────────── */
  auth.onAuthStateChanged(user => {
    if (user) {
      showDashboard(user);
    } else {
      showLogin();
    }
  });

  function showDashboard(user) {
    document.getElementById('auth-section').style.display  = 'none';
    document.getElementById('dash-section').style.display  = 'block';
    document.getElementById('header-user').classList.add('show');
    document.getElementById('header-email').textContent = user.email;

    unsubscribeSnapshot = db.collection('formularios')
      .orderBy('criadoEm', 'desc')
      .onSnapshot(snap => {
        document.getElementById('forms-loading').style.display = 'none';
        document.getElementById('forms-list').style.display    = 'block';
        renderList(snap.docs);
      }, err => {
        console.error(err);
        document.getElementById('forms-loading').innerHTML =
          '<p style="color:var(--error)">Erro ao carregar. Verifique as permissões do Firestore.</p>';
      });
  }

  function showLogin() {
    document.getElementById('auth-section').style.display = 'flex';
    document.getElementById('dash-section').style.display = 'none';
    document.getElementById('header-user').classList.remove('show');
    document.getElementById('forms-loading').style.display = 'block';
    document.getElementById('forms-list').style.display    = 'none';
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  }

  function handleLogout() {
    auth.signOut();
  }

  /* ── Login form ────────────────────────────────────────────── */
  function togglePw() {
    const inp  = document.getElementById('password');
    const show = document.getElementById('icon-show');
    const hide = document.getElementById('icon-hide');
    const hide_ = inp.type === 'password';
    inp.type = hide_ ? 'text' : 'password';
    show.style.display = hide_ ? 'none'  : '';
    hide.style.display = hide_ ? ''      : 'none';
  }

  function setErr(id, errId, on) {
    const el  = document.getElementById(id);
    const msg = document.getElementById(errId);
    if (on) { el.classList.add('err'); msg.classList.add('show'); }
    else    { el.classList.remove('err'); msg.classList.remove('show'); }
  }

  ['email','password'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById(id).classList.remove('err');
      document.getElementById(id === 'email' ? 'email-err' : 'pw-err').classList.remove('show');
    });
  });

  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pw    = document.getElementById('password').value;
    let ok = true;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr('email','email-err',true); ok = false; }
    else setErr('email','email-err',false);

    if (!pw) { setErr('password','pw-err',true); ok = false; }
    else setErr('password','pw-err',false);

    if (!ok) { showToast('Preencha todos os campos.'); return; }

    const btn = document.getElementById('btn-login');
    btn.classList.add('loading');
    btn.disabled = true;

    auth.signInWithEmailAndPassword(email, pw)
      .catch(err => {
        btn.classList.remove('loading');
        btn.disabled = false;
        const msg = ['auth/wrong-password','auth/user-not-found','auth/invalid-credential','auth/invalid-email']
          .includes(err.code)
          ? 'E-mail ou senha incorretos.'
          : 'Erro ao entrar. Tente novamente.';
        showToast(msg);
        setErr('email','email-err',true);
        setErr('password','pw-err',true);
      });
  }

  /* ── Toast ─────────────────────────────────────────────────── */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ── Render list ───────────────────────────────────────────── */
  function renderList(docs) {
    const list  = document.getElementById('forms-list');
    const count = document.getElementById('form-count');
    const label = document.getElementById('count-label');

    count.textContent = docs.length;
    label.textContent = docs.length === 1 ? 'formulário' : 'formulários';

    if (!docs.length) {
      list.innerHTML = '<div class="empty-state">Nenhum formulário enviado ainda.</div>';
      return;
    }
    list.innerHTML = docs.map(doc => renderCard(doc)).join('');
  }

  /* ── HTML escape ───────────────────────────────────────────── */
  function esc(s) {
    if (s == null || s === '') return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Field & Section helpers ───────────────────────────────── */
  function field(label, value) {
    const v = (value ?? '').toString().trim();
    if (!v || v === '/') return '';
    return `<div class="field-row"><span class="field-key">${label}</span><span class="field-val">${esc(v)}</span></div>`;
  }

  function section(title, fields) {
    const rows = fields.filter(Boolean).join('');
    if (!rows.trim()) return '';
    return `<div class="data-section"><div class="data-section-title">${title}</div><div class="field-grid">${rows}</div></div>`;
  }

  function addrSection(title, a) {
    if (!a) return '';
    return section(title, [
      field('CEP',         a.cep),
      field('Logradouro',  a.logradouro),
      field('Número',      a.numero),
      field('Complemento', a.complemento),
      field('Bairro',      a.bairro),
      field('Cidade',      a.cidade),
      field('UF',          a.uf),
    ]);
  }

  /* ── Render single card ────────────────────────────────────── */
  function renderCard(doc) {
    const d  = doc.data();
    const ev = d.evento       || {};
    const co = d.contratante  || {};
    const rl = d.representante|| {};
    const rs = d.solidario    || {};
    const pl = d.produtorLocal|| {};
    const bk = d.bancario     || {};
    const dox= d.documentos   || {};

    const nomeEvento = ev.nome || '(sem nome)';
    const dataEvento = ev.data || '';

    let criadoStr = '';
    if (d.criadoEm?.toDate) {
      criadoStr = 'Enviado em ' + d.criadoEm.toDate()
        .toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    const docLabels = {
      cnpj:         'Comprovante CNPJ',
      contrato:     'Contrato / MEI',
      ie:           'Inscrição Estadual',
      rl_frente:    'RG/CNH – Frente',
      rl_verso:     'RG/CNH – Verso',
      rl_residencia:'Comp. Residência',
    };
    const dlIcon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
    const docBtns = Object.entries(dox)
      .filter(([,url]) => url)
      .map(([key,url]) => `<a href="${esc(url)}" target="_blank" rel="noopener" class="btn-doc">${dlIcon} ${docLabels[key] || key}</a>`)
      .join('');

    const tipoConta = bk.tipoConta === 'corrente' ? 'Conta Corrente'
                    : bk.tipoConta === 'poupanca' ? 'Conta Poupança'
                    : bk.tipoConta || '';

    const body = `
      ${section('Dados do Evento', [
        field('Nome do Evento',      ev.nome),
        field('Data',                ev.data),
        field('Abertura de Vendas',  ev.aberturaVendas),
        field('Horário',             ev.horario),
        field('Local',               ev.local),
        field('Cidade',              ev.cidade),
        field('UF',                  ev.uf),
      ])}
      ${addrSection('Endereço do Evento', ev.endereco)}

      ${section('Dados do Contratante', [
        field('Razão Social',    co.razaoSocial),
        field('Nome Fantasia',   co.nomeFantasia),
        field('CNPJ',            co.cnpj),
        field('I.E.',            co.ie),
        field('I.M.',            co.im),
        field('Data de Fundação',co.dataFundacao),
        field('Telefone',        co.telefone),
        field('Celular',         co.celular),
        field('E-mail',          co.email),
        field('Pessoa de Contato',co.pessoaContato),
        field('Função',          co.funcao),
      ])}
      ${addrSection('Endereço do Contratante', co.endereco)}

      ${section('Representante Legal', [
        field('Nome',             rl.nome),
        field('CPF',              rl.cpf),
        field('RG',               rl.rg),
        field('Órgão Expedidor',  rl.orgaoExpedidor),
        field('Data de Nascimento',rl.dataNascimento),
        field('Estado Civil',     rl.estadoCivil),
        field('E-mail',           rl.email),
        field('Telefone',         rl.telefone),
        field('Celular',          rl.celular),
        field('Assina pela empresa', rl.assina),
        field('Usuário de acesso',   rl.usuario),
        field('Gestor',              rl.gestor),
      ])}
      ${addrSection('Endereço do Representante', rl.endereco)}

      ${section('Responsável Solidário', [
        field('Nome',     rs.nome),
        field('CPF',      rs.cpf),
        field('E-mail',   rs.email),
        field('Telefone', rs.telefone),
      ])}
      ${addrSection('Endereço do Responsável Solidário', rs.endereco)}

      ${section('Produtor Local', [
        pl.semProdutor ? field('Situação', 'Sem produtor local') : '',
        field('Telefone', pl.telefone),
        field('E-mail',   pl.email),
      ])}

      ${section('Dados Bancários', [
        field('Tipo de Conta', tipoConta),
        field('Favorecido',    bk.favorecido),
        field('CPF / CNPJ',   bk.documento),
        field('Banco',         bk.banco),
        field('Agência',       bk.agencia),
        field('Conta',         bk.conta),
        field('Chave PIX',     bk.pix),
      ])}

      ${docBtns ? `<div class="data-section"><div class="data-section-title">Documentos</div><div class="doc-btns">${docBtns}</div></div>` : ''}
    `;

    return `
      <div class="sub-card">
        <div class="sub-header" onclick="toggleCard(this)">
          <div class="sub-left">
            <svg class="sub-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
            <div style="min-width:0">
              <div class="sub-title">${esc(nomeEvento)}</div>
              <div class="sub-meta">${esc(dataEvento)}${dataEvento && criadoStr ? ' · ' : ''}${esc(criadoStr)}</div>
            </div>
          </div>
          <span class="badge-status">${esc(d.status || 'pendente')}</span>
        </div>
        <div class="sub-body">${body}</div>
      </div>
    `;
  }

  /* ── Toggle expand ─────────────────────────────────────────── */
  function toggleCard(header) {
    const body  = header.closest('.sub-card').querySelector('.sub-body');
    const arrow = header.querySelector('.sub-arrow');
    const open  = body.classList.toggle('open');
    arrow.classList.toggle('open', open);
  }
</script>
</body>
</html>
